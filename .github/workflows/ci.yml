name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same ref are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches Backend/pyproject.toml (ruff target) and the Dockerfile base.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test (pytest)
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Dockerfile base image (node:24-alpine).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build / typecheck
        run: npm run build

  docker:
    name: Docker (compose build)
    runs-on: ubuntu-latest
    # Only build images if the code itself is sound; no point paying for a
    # slow image build on a pull request whose tests already fail.
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Catches a malformed compose file in seconds, with a clear error.
      - name: Validate compose file
        run: docker compose config --quiet

      # Catches a broken Dockerfile or a missing build context. These images are
      # the documented way to run this project, so they must keep building.
      - name: Build images
        run: docker compose build