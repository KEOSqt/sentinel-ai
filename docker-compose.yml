services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      SENTINEL_DATABASE_URL: sqlite:////data/sentinel.db
      SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-["http://localhost:3000"]}
      SENTINEL_LLM_PROVIDER: ${SENTINEL_LLM_PROVIDER:-auto}
      SENTINEL_OPENROUTER_API_KEY: ${SENTINEL_OPENROUTER_API_KEY:-}
      SENTINEL_OPENROUTER_MODEL: ${SENTINEL_OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      SENTINEL_OPENAI_API_KEY: ${SENTINEL_OPENAI_API_KEY:-}
      SENTINEL_OPENAI_MODEL: ${SENTINEL_OPENAI_MODEL:-gpt-4o-mini}
      SENTINEL_OLLAMA_BASE_URL: ${SENTINEL_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SENTINEL_OLLAMA_MODEL: ${SENTINEL_OLLAMA_MODEL:-llama3.1}
      SENTINEL_NVD_API_KEY: ${SENTINEL_NVD_API_KEY:-}
      SENTINEL_NVD_ENABLED: ${SENTINEL_NVD_ENABLED:-true}
      SENTINEL_NVD_CACHE_TTL_SECONDS: ${SENTINEL_NVD_CACHE_TTL_SECONDS:-900}
      SENTINEL_NVD_MIN_INTERVAL_SECONDS: ${SENTINEL_NVD_MIN_INTERVAL_SECONDS:-6}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data: