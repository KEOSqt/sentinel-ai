services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      SENTINEL_DATABASE_URL: sqlite:////data/sentinel.db
      SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-["http://localhost:3000"]}
      SENTINEL_OPENAI_API_KEY: ${SENTINEL_OPENAI_API_KEY:-}
      SENTINEL_ANTHROPIC_API_KEY: ${SENTINEL_ANTHROPIC_API_KEY:-}
      SENTINEL_OLLAMA_BASE_URL: ${SENTINEL_OLLAMA_BASE_URL:-http://localhost:11434}
      SENTINEL_NVD_API_KEY: ${SENTINEL_NVD_API_KEY:-}
      SENTINEL_NVD_ENABLED: ${SENTINEL_NVD_ENABLED:-true}
    volumes:
      - backend-data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data: